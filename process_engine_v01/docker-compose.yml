# Productie-profiel: aparte Postgres-container voor Operaton-history,
# de officiële Operaton-image, en de Process Engine Go-binary.
#
# Voor dev/test waarbij je de Postgres-instantie van het bitemp register
# wilt hergebruiken (eigen database daarbinnen): zie docker-compose.dev.yml.

services:

  process-engine-db:
    image: postgres:16-alpine
    container_name: process-engine-db
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton
    volumes:
      - process_engine_db_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton -d operaton"]
      interval: 5s
      timeout: 5s
      retries: 20

  operaton:
    image: operaton/operaton:2.1.0
    container_name: operaton
    depends_on:
      process-engine-db:
        condition: service_healthy
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://process-engine-db:5432/operaton
      DB_USERNAME: operaton
      DB_PASSWORD: operaton
      WAIT_FOR: process-engine-db:5432
    ports:
      - "8080:8080"  # REST API + Cockpit + Tasklist
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  process-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: process-engine
    depends_on:
      operaton:
        condition: service_healthy
    environment:
      PROCESS_ENGINE_ADDR: ":8090"
      OPERATON_BASE_URL: http://operaton:8080/engine-rest
    ports:
      - "8090:8090"

volumes:
  process_engine_db_data:
