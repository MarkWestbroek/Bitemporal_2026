services:
  bitemp-go-api:
    image: ${API_IMAGE:-markwestbroek/bitemp-go-api:v05}
    container_name: bitemp-go-api-v05
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@${DB_HOST:-bitemp-postgres-v05}:${DB_PORT:-5432}/${POSTGRES_DB:-bitemp_go_db_v05}?sslmode=${DB_SSLMODE:-disable}"
      APP_ENV: "${APP_ENV:-production}"
      GIN_MODE: "${GIN_MODE:-release}"
      ALLOW_DROP_TABLES: "${ALLOW_DROP_TABLES:-false}"
      ADMIN_DROP_PASSWORD: "${ADMIN_DROP_PASSWORD:-change-me}"
    networks:
      - bitemp-net

networks:
  bitemp-net:
    name: bitemp-net
