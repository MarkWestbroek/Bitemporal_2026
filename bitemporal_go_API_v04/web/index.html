<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitemporal Visualizer</title>
    <style>
      :root {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      input, select, button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
      }
      button {
        cursor: pointer;
        background: #0f172a;
        color: white;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .muted {
        color: #475569;
        font-size: 13px;
      }
      .graph {
        width: 100%;
        min-height: 520px;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
      }
      .node {
        fill: white;
        stroke: #334155;
        stroke-width: 1.2;
      }
      .edge {
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .label {
        font-size: 13px;
        fill: #0f172a;
      }
      .label-lg {
        font-size: 15px;
      }
      .label-left-lg {
        font-size: 18px;
      }
      .page-title {
        font-size: 26px;
        margin: 0 0 8px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(460px, 1fr) minmax(660px, 1.35fr);
        gap: 16px;
        margin-top: 16px;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      @media (max-width: 900px) {
        .controls,
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function safeArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function normaliseerNietNegatiefGeheelGetal(value, fallback = 0) {
        const parsed = Number.parseInt(String(value), 10);
        if (Number.isNaN(parsed)) {
          return fallback;
        }
        return Math.max(0, parsed);
      }

      function vindAIdVanuitRegistratie(registratie, as) {
        const wijzigingen = safeArray(registratie?.wijzigingen);
        for (const wijziging of wijzigingen) {
          const kandidaatId = wijziging?.entiteit_id;
          if (kandidaatId === null || kandidaatId === undefined || kandidaatId === '') {
            continue;
          }

          const kandidaatAlsString = String(kandidaatId);
          const bestaatInAs = as.some((item) => String(item.id) === kandidaatAlsString);
          if (bestaatInAs) {
            return kandidaatAlsString;
          }
        }
        return '';
      }

      function tUitRegistratieTijdstip(tijdstipRaw) {
        if (!tijdstipRaw) {
          return null;
        }

        const tijdstipMillis = Date.parse(tijdstipRaw);
        const basisMillis = Date.parse('2026-01-01T00:00:00Z');
        if (Number.isNaN(tijdstipMillis) || Number.isNaN(basisMillis)) {
          return null;
        }

        const deltaMillis = tijdstipMillis - basisMillis;
        const afgerondeUren = Math.round(deltaMillis / (60 * 60 * 1000));
        if (afgerondeUren < 0) {
          return null;
        }

        return afgerondeUren;
      }

      function wijzigingKleur(wijzigingstype) {
        const type = String(wijzigingstype || '').toLowerCase();
        if (type === 'opvoer') {
          return '#dcfce7';
        }
        if (type === 'afvoer') {
          return '#ffedd5';
        }
        return '#f8fafc';
      }

      function microsecondeIntVanTijdstip(tijdstipRaw) {
        if (!tijdstipRaw) {
          return 0;
        }

        const raw = String(tijdstipRaw);
        const match = raw.match(/\.(\d+)/);
        if (!match) {
          return 0;
        }

        const fraction = match[1].slice(0, 6).padEnd(6, '0');
        const parsed = Number.parseInt(fraction, 10);
        return Number.isNaN(parsed) ? 0 : parsed;
      }

      function App() {
        const [baseUrl, setBaseUrl] = useState(window.location.origin);
        const [t, setT] = useState(1);
        const [registratieId, setRegistratieId] = useState(1);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [responseData, setResponseData] = useState(null);
        const [registratieData, setRegistratieData] = useState(null);
        const [ongedaanGemaakteRegistratieData, setOngedaanGemaakteRegistratieData] = useState(null);
        const [selectedAId, setSelectedAId] = useState('');

        async function loadData({ tValue = t, registratieIdValue = registratieId, selecteerVanuitRegistratie = false } = {}) {
          setLoading(true);
          setError('');
          try {
            const doelRegistratieId = normaliseerNietNegatiefGeheelGetal(registratieIdValue, normaliseerNietNegatiefGeheelGetal(registratieId, 0));
            const defaultPeilmoment = normaliseerNietNegatiefGeheelGetal(tValue, normaliseerNietNegatiefGeheelGetal(t, 0));
            let peilmomentVoorAs = defaultPeilmoment;

            const registratieByIdUrl = `${baseUrl}/full/registraties/${encodeURIComponent(doelRegistratieId)}`;
            const registratieByIdRes = await fetch(registratieByIdUrl);

            if (!registratieByIdRes.ok && registratieByIdRes.status !== 404) {
              throw new Error(`Registratie HTTP ${registratieByIdRes.status}: ${registratieByIdRes.statusText}`);
            }

            let registratieJson = null;
            if (registratieByIdRes.ok) {
              registratieJson = await registratieByIdRes.json();
            }

            if (selecteerVanuitRegistratie && registratieJson?.tijdstip) {
              const afgeleidT = tUitRegistratieTijdstip(registratieJson.tijdstip);
              if (afgeleidT !== null) {
                peilmomentVoorAs = afgeleidT;
                setT(afgeleidT);
              }
            }

            const asUrl = `${baseUrl}/full/as/?t=${encodeURIComponent(peilmomentVoorAs)}`;
            const asRes = await fetch(asUrl);

            if (!asRes.ok) {
              throw new Error(`As HTTP ${asRes.status}: ${asRes.statusText}`);
            }

            const asJson = await asRes.json();

            let ongedaanGemaakteRegistratieJson = null;
            if (registratieJson?.registratietype === 'ongedaanmaking' && registratieJson?.maakt_ongedaan_registratie_id) {
              const doelId = registratieJson.maakt_ongedaan_registratie_id;
              const doelRes = await fetch(`${baseUrl}/full/registraties/${encodeURIComponent(doelId)}`);
              if (doelRes.ok) {
                ongedaanGemaakteRegistratieJson = await doelRes.json();
              }
            }

            setResponseData(asJson);
            setRegistratieData(registratieJson);
            setOngedaanGemaakteRegistratieData(ongedaanGemaakteRegistratieJson);

            const as = safeArray(asJson.As);
            const aIdVanuitRegistratie = vindAIdVanuitRegistratie(registratieJson, as);

            setSelectedAId((vorigeAId) => {
              if (as.length === 0) {
                return '';
              }

              if (selecteerVanuitRegistratie && aIdVanuitRegistratie) {
                return aIdVanuitRegistratie;
              }

              const heeftVorigeNog = as.some((item) => String(item.id) === String(vorigeAId));
              if (heeftVorigeNog) {
                return String(vorigeAId);
              }

              return String(as[0].id);
            });
          } catch (err) {
            setError(err.message || 'Onbekende fout bij ophalen data');
            setResponseData(null);
            setRegistratieData(null);
            setOngedaanGemaakteRegistratieData(null);
            setSelectedAId('');
          } finally {
            setLoading(false);
          }
        }

        function incrementRegistratieAndReload() {
          if (loading) {
            return;
          }
          const currentRegistratieId = normaliseerNietNegatiefGeheelGetal(registratieId, 0);
          const nextRegistratieId = currentRegistratieId + 1;
          setRegistratieId(nextRegistratieId);
          loadData({ tValue: t, registratieIdValue: nextRegistratieId, selecteerVanuitRegistratie: true });
        }

        function decrementRegistratieAndReload() {
          if (loading) {
            return;
          }
          const currentRegistratieId = normaliseerNietNegatiefGeheelGetal(registratieId, 0);
          const nextRegistratieId = Math.max(0, currentRegistratieId - 1);
          setRegistratieId(nextRegistratieId);
          loadData({ tValue: t, registratieIdValue: nextRegistratieId, selecteerVanuitRegistratie: true });
        }

        function incrementTAndReload() {
          if (loading) {
            return;
          }
          const currentT = normaliseerNietNegatiefGeheelGetal(t, 0);
          const nextT = currentT + 1;
          setT(nextT);
          loadData({ tValue: nextT, registratieIdValue: registratieId, selecteerVanuitRegistratie: false });
        }

        function decrementTAndReload() {
          if (loading) {
            return;
          }
          const currentT = normaliseerNietNegatiefGeheelGetal(t, 0);
          const nextT = Math.max(0, currentT - 1);
          setT(nextT);
          loadData({ tValue: nextT, registratieIdValue: registratieId, selecteerVanuitRegistratie: false });
        }

        useEffect(() => {
          loadData();
        }, []);

        useEffect(() => {
          function handleKeyDown(event) {
            const tagName = event.target?.tagName || '';
            if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA') {
              return;
            }

            if (event.key === 'ArrowRight') {
              event.preventDefault();
              incrementRegistratieAndReload();
            }
            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              decrementRegistratieAndReload();
            }
            if (event.key === 'ArrowUp') {
              event.preventDefault();
              incrementTAndReload();
            }
            if (event.key === 'ArrowDown') {
              event.preventDefault();
              decrementTAndReload();
            }
          }

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [t, registratieId, loading]);

        const as = safeArray(responseData?.As);
        const selectedA = useMemo(() => as.find((item) => String(item.id) === String(selectedAId)) || null, [as, selectedAId]);

        const us = safeArray(selectedA?.us);
        const vs = safeArray(selectedA?.vs);
        const selectedRegistratie = registratieData;
        const selectedRegistratieWijzigingen = safeArray(registratieData?.wijzigingen);
        const isOngedaanmaking = selectedRegistratie?.registratietype === 'ongedaanmaking';
        const ongedaanGemaakteWijzigingen = safeArray(ongedaanGemaakteRegistratieData?.wijzigingen);
        const visualRegistratie = isOngedaanmaking ? ongedaanGemaakteRegistratieData : selectedRegistratie;
        const visualWijzigingen = isOngedaanmaking ? ongedaanGemaakteWijzigingen : selectedRegistratieWijzigingen;
        const registratieTitel = selectedRegistratie?.registratietype
          ? selectedRegistratie.registratietype.charAt(0).toUpperCase() + selectedRegistratie.registratietype.slice(1)
          : 'Registratie';
        const nadrukStyle = { fontWeight: 700, fontSize: '15px' };
        const nadrukStyleLinks = { fontWeight: 700, fontSize: '18px' };
        const grootKruisEindY = visualWijzigingen.length > 0
          ? 108 + ((visualWijzigingen.length - 1) * 92) + 84
          : 82;

        return (
          <div className="container">
            <h1 className="page-title">Visualisatie tijdreizen (formele tijd)</h1>
            <p style={{ margin: '0 0 8px' }}><a className="muted" href="/viz/tijdlijn.html">Open tijdslijnvisualisatie</a></p>
            <p className="muted">Kies registratie-id of peilmoment, en volg desgewenst een specifieke entiteit.
              Tip: ←/→ navigeert registratie-id, ↑/↓ navigeert peilmoment t.</p>

            <div className="card">
              <div className="controls" style={{ gridTemplateColumns: 'repeat(4, minmax(180px, 1fr))' }}>
                <label>
                  API base URL
                  <input value={baseUrl} onChange={(e) => setBaseUrl(e.target.value.trim())} placeholder="http://localhost:8080" />
                </label>

                <label>
                  Registratie-id
                  <input type="number" value={registratieId} onChange={(e) => setRegistratieId(e.target.value)} min="0" step="1" />
                </label>

                <label>
                  Peilmoment (t)
                  <input type="number" value={t} onChange={(e) => setT(e.target.value)} min="0" step="1" />
                </label>

                <label>
                  Entiteit A
                  <select value={selectedAId} onChange={(e) => setSelectedAId(e.target.value)} disabled={as.length === 0}>
                    {as.length === 0 && <option value="">Geen resultaten</option>}
                    {as.map((a) => (
                      <option key={a.id} value={a.id}>A #{a.id}</option>
                    ))}
                  </select>
                </label>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(180px, 1fr))', gap: 12, marginTop: 10, alignItems: 'start' }}>
                <div style={{ gridColumn: '2 / 3' }}>
                  <p className="muted" style={{ margin: '0 0 6px' }}>1) Door registratie-id lopen (volgt entiteit in registratie)</p>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={decrementRegistratieAndReload} disabled={loading || normaliseerNietNegatiefGeheelGetal(registratieId, 0) <= 0}>reg-id - 1</button>
                    <button onClick={incrementRegistratieAndReload} disabled={loading}>reg-id + 1</button>
                    <div className="muted">(Entiteit blijft staan bij geen match)</div>
                  </div>
                </div>

                <div style={{ gridColumn: '3 / 4' }}>
                  <p className="muted" style={{ margin: '0 0 6px' }}>2) Door peilmoment lopen (houdt gekozen entiteit vast)</p>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={decrementTAndReload} disabled={loading || normaliseerNietNegatiefGeheelGetal(t, 0) <= 0}>t - 1</button>
                    <button onClick={incrementTAndReload} disabled={loading}>t + 1</button>
                  </div>
                </div>

                <div style={{ gridColumn: '4 / 5' }}>
                  <p className="muted" style={{ margin: '0 0 6px' }}>3) Data ophalen</p>
                  <button onClick={() => loadData({ selecteerVanuitRegistratie: true })} disabled={loading}>
                    {loading ? 'Bezig met ophalen...' : 'Ophalen'}
                  </button>
                </div>
              </div>

              {error && <p style={{ color: '#dc2626' }}>Fout: {error}</p>}
              {responseData?.has_more && <p className="muted">Let op: has_more=true, niet alle A-entiteiten zijn geladen.</p>}
            </div>
            
              <p className="muted" style={{ margin: 0 }}>
                Huidige selectie: peilmoment t={normaliseerNietNegatiefGeheelGetal(t, 0)} | registratie-id={normaliseerNietNegatiefGeheelGetal(registratieId, 0)}
              </p>

            <div className="row" style={{ marginTop: 16 }}>
              <div className="card">
                <h2>{selectedRegistratie ? `${registratieTitel} ${selectedRegistratie.id}` : registratieTitel}</h2>

                {!selectedRegistratie ? (
                  <p className="muted">Geen registratie met dit registratie-id gevonden.</p>
                ) : (
                  <>
                    {!visualRegistratie ? (
                      <p className="muted">Geen registratie om te visualiseren.</p>
                    ) : (
                      <svg className="graph" viewBox="0 0 760 520" preserveAspectRatio="xMidYMid meet">
                        <g>
                          <rect className="node" x="220" y="10" rx="10" width="320" height="72" style={{ fill: '#ecfeff' }} />
                          <text className="label" x="532" y="26" textAnchor="end">t: {microsecondeIntVanTijdstip(visualRegistratie.tijdstip)}</text>
                          <text className="label label-left-lg" x="236" y="37">
                            <tspan style={nadrukStyleLinks}>Reg</tspan>
                            {' id='}
                            <tspan style={nadrukStyleLinks}>{visualRegistratie.id}</tspan>
                            {` | type=${visualRegistratie.registratietype}`}
                          </text>
                        </g>

                        {visualWijzigingen.map((w, index) => {
                          const y = 108 + index * 92;
                          return (
                            <g key={`vwz-${w.id || index}`}>
                              <line className="edge" x1="380" y1="82" x2="380" y2={y - 12} />
                              <rect className="node" x="90" y={y} rx="8" width="580" height="84" style={{ fill: wijzigingKleur(w.wijzigingstype) }} />
                              <line x1="283" y1={y} x2="283" y2={y + 84} stroke="#cbd5e1" strokeWidth="1" />
                              <line x1="476" y1={y} x2="476" y2={y + 84} stroke="#cbd5e1" strokeWidth="1" />
                              <text className="label label-left-lg" x="106" y={y + 46}>{w.wijzigingstype}</text>
                              <text className="label" x="299" y={y + 46}>
                                {'entiteit='}
                                <tspan style={nadrukStyle}>{w.entiteitnaam}</tspan>
                                {': '}
                                <tspan style={nadrukStyle}>{w.entiteit_id}</tspan>
                              </text>
                              {!((w.representatienaam === null || w.representatienaam === undefined || w.representatienaam === '') && (w.representatie_id === null || w.representatie_id === undefined || w.representatie_id === '')) && (
                                <text className="label" x="492" y={y + 46}>
                                  {'rep='}
                                  <tspan style={(w.representatienaam === null || w.representatienaam === undefined || w.representatienaam === '') ? undefined : nadrukStyle}>
                                    {w.representatienaam || '-'}
                                  </tspan>
                                  {': '}
                                  <tspan style={(w.representatie_id === null || w.representatie_id === undefined || w.representatie_id === '') ? undefined : nadrukStyle}>
                                    {w.representatie_id || '-'}
                                  </tspan>
                                </text>
                              )}
                            </g>
                          );
                        })}

                        {isOngedaanmaking && (
                          <>
                            <line x1="92" y1="10" x2="668" y2={grootKruisEindY} stroke="#dc2626" strokeWidth="4" strokeLinecap="round" />
                            <line x1="668" y1="10" x2="92" y2={grootKruisEindY} stroke="#dc2626" strokeWidth="4" strokeLinecap="round" />
                          </>
                        )}

                        {visualWijzigingen.length === 0 && <text className="label" x="230" y="170">Geen wijzigingen onder deze registratie</text>}
                      </svg>
                    )}

                    {isOngedaanmaking ? (
                      <>
                        <h3 style={{ marginTop: 12 }}>Ongedaan gemaakte registratie</h3>
                        {!ongedaanGemaakteRegistratieData ? (
                          <p className="muted">Doelregistratie niet gevonden.</p>
                        ) : (
                          <>
                            <p className="muted" style={{ margin: 0 }}>
                              id={ongedaanGemaakteRegistratieData.id} | type={ongedaanGemaakteRegistratieData.registratietype} | tijdstip={microsecondeIntVanTijdstip(ongedaanGemaakteRegistratieData.tijdstip)}
                            </p>
                            <h3 style={{ marginTop: 12 }}>Wijzigingen onder doelregistratie</h3>
                            <ul>
                              {ongedaanGemaakteWijzigingen.length === 0 && <li>Geen wijzigingen onder deze doelregistratie</li>}
                              {ongedaanGemaakteWijzigingen.map((w, index) => (
                                <li key={`wz-doel-${w.id || index}`}>
                                  {w.wijzigingstype} | entiteit={w.entiteitnaam}:{w.entiteit_id} | rep={w.representatienaam || '-'}:{w.representatie_id || '-'}
                                </li>
                              ))}
                            </ul>
                          </>
                        )}
                      </>
                    ) : (
                      <>
                        <h3 style={{ marginTop: 12 }}>Wijzigingen</h3>
                        <ul>
                          {selectedRegistratieWijzigingen.length === 0 && <li>Geen wijzigingen onder deze registratie</li>}
                          {selectedRegistratieWijzigingen.map((w, index) => (
                            <li key={`wz-${w.id || index}`}>
                              {w.wijzigingstype} | entiteit={w.entiteitnaam}:{w.entiteit_id} | rep={w.representatienaam || '-'}:{w.representatie_id || '-'}
                            </li>
                          ))}
                        </ul>
                      </>
                    )}
                  </>
                )}
              </div>

              <div className="card">
                <h2>Representaties</h2>
                {!selectedA ? (
                  <p className="muted">Geen entiteit geselecteerd.</p>
                ) : (
                  <svg className="graph" viewBox="0 0 900 460" preserveAspectRatio="xMidYMid meet">
                    {us.map((u, i) => {
                      const y = 55 + i * 90;
                      return (
                        <g key={`u-${u.rel_id || i}`}>
                          <line className="edge" x1="300" y1="160" x2="180" y2={y} />
                          <rect className="node" x="60" y={y - 30} rx="8" width="240" height="60" />
                          <text className="label label-lg" x="292" y={y - 16} textAnchor="end">opv: {u.opvoer ? microsecondeIntVanTijdstip(u.opvoer) : '-'}</text>
                          <text className="label label-lg" x="72" y={y - 8}>
                            <tspan style={nadrukStyle}>U</tspan>
                            {' rel_id='}
                            <tspan style={nadrukStyle}>{u.rel_id ?? '-'}</tspan>
                          </text>
                          <text className="label label-lg" x="72" y={y + 12}>{`${u.aaa ?? ''} | ${u.bbb ?? ''}`}</text>
                        </g>
                      );
                    })}

                    <g>
                      <rect className="node" x="330" y="120" rx="10" width="240" height="80" style={{ fill: '#dbeafe' }} />
                      <text className="label label-lg" x="562" y="136" textAnchor="end">opv: {selectedA.opvoer ? microsecondeIntVanTijdstip(selectedA.opvoer) : '-'}</text>
                      <text className="label label-lg" x="345" y="152">
                        <tspan style={nadrukStyle}>A</tspan>
                        {' id='}
                        <tspan style={nadrukStyle}>{selectedA.id}</tspan>
                      </text>
                      <text className="label label-lg" x="345" y="175">opvoer={selectedA.opvoer ? microsecondeIntVanTijdstip(selectedA.opvoer) : '-'}</text>
                    </g>

                    {vs.map((v, i) => {
                      const y = 55 + i * 90;
                      return (
                        <g key={`v-${v.rel_id || i}`}>
                          <line className="edge" x1="570" y1="160" x2="690" y2={y} />
                          <rect className="node" x="690" y={y - 30} rx="8" width="180" height="60" />
                          <text className="label label-lg" x="862" y={y - 16} textAnchor="end">opv: {v.opvoer ? microsecondeIntVanTijdstip(v.opvoer) : '-'}</text>
                          <text className="label label-lg" x="700" y={y - 6}>
                            <tspan style={nadrukStyle}>V</tspan>
                            {' rel_id='}
                            <tspan style={nadrukStyle}>{v.rel_id ?? '-'}</tspan>
                          </text>
                          <text className="label label-lg" x="700" y={y + 14}>ccc={v.ccc ?? ''}</text>
                        </g>
                      );
                    })}
                  </svg>
                )}
              </div>
            </div>

            <div className="row">
              <div className="card">
                <h3>U-details</h3>
                <ul>
                  {us.length === 0 && <li>Geen U records</li>}
                  {us.map((u, index) => (
                    <li key={`ud-${u.rel_id || index}`}>
                      rel_id={u.rel_id ?? '-'} | aaa={u.aaa ?? '-'} | bbb={u.bbb ?? '-'} | opvoer={u.opvoer ? microsecondeIntVanTijdstip(u.opvoer) : '-'}
                    </li>
                  ))}
                </ul>
              </div>

              <div className="card">
                <h3>V-details</h3>
                <ul>
                  {vs.length === 0 && <li>Geen V records</li>}
                  {vs.map((v, index) => (
                    <li key={`vd-${v.rel_id || index}`}>
                      rel_id={v.rel_id ?? '-'} | ccc={v.ccc ?? '-'} | opvoer={v.opvoer ? microsecondeIntVanTijdstip(v.opvoer) : '-'}
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
