<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitemporal Visualizer</title>
    <style>
      :root {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 24px;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      input, select, button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
      }
      button {
        cursor: pointer;
        background: #0f172a;
        color: white;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .muted {
        color: #475569;
        font-size: 13px;
      }
      .graph {
        width: 100%;
        min-height: 420px;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        background: #f8fafc;
      }
      .node {
        fill: white;
        stroke: #334155;
        stroke-width: 1.2;
      }
      .edge {
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      .label {
        font-size: 13px;
        fill: #0f172a;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(460px, 1fr) minmax(660px, 1.35fr);
        gap: 16px;
        margin-top: 16px;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      @media (max-width: 900px) {
        .controls,
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function safeArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function wijzigingKleur(wijzigingstype) {
        const type = String(wijzigingstype || '').toLowerCase();
        if (type === 'opvoer') {
          return '#dcfce7';
        }
        if (type === 'afvoer') {
          return '#ffedd5';
        }
        return '#f8fafc';
      }

      function App() {
        const [baseUrl, setBaseUrl] = useState(window.location.origin);
        const [t, setT] = useState(1);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [responseData, setResponseData] = useState(null);
        const [registratieData, setRegistratieData] = useState(null);
        const [ongedaanGemaakteRegistratieData, setOngedaanGemaakteRegistratieData] = useState(null);
        const [selectedAId, setSelectedAId] = useState('');

        async function loadData(tValue = t) {
          setLoading(true);
          setError('');
          try {
            const asUrl = `${baseUrl}/full/as/?t=${encodeURIComponent(tValue)}`;
            const registratieId = Math.max(0, Number.parseInt(String(tValue), 10) || 0);
            const registratieByIdUrl = `${baseUrl}/full/registraties/${encodeURIComponent(registratieId)}`;

            const [asRes, registratieByIdRes] = await Promise.all([
              fetch(asUrl),
              fetch(registratieByIdUrl),
            ]);

            if (!asRes.ok) {
              throw new Error(`As HTTP ${asRes.status}: ${asRes.statusText}`);
            }
            if (!registratieByIdRes.ok && registratieByIdRes.status !== 404) {
              throw new Error(`Registratie HTTP ${registratieByIdRes.status}: ${registratieByIdRes.statusText}`);
            }

            const asJson = await asRes.json();
            let registratieJson = null;
            if (registratieByIdRes.ok) {
              registratieJson = await registratieByIdRes.json();
            }

            let ongedaanGemaakteRegistratieJson = null;
            if (registratieJson?.registratietype === 'ongedaanmaking' && registratieJson?.maakt_ongedaan_registratie_id) {
              const doelId = registratieJson.maakt_ongedaan_registratie_id;
              const doelRes = await fetch(`${baseUrl}/full/registraties/${encodeURIComponent(doelId)}`);
              if (doelRes.ok) {
                ongedaanGemaakteRegistratieJson = await doelRes.json();
              }
            }

            setResponseData(asJson);
            setRegistratieData(registratieJson);
            setOngedaanGemaakteRegistratieData(ongedaanGemaakteRegistratieJson);

            const as = safeArray(asJson.As);
            setSelectedAId((previousSelectedAId) => {
              if (as.length === 0) {
                return '';
              }

              const hasPrevious = as.some((item) => String(item.id) === String(previousSelectedAId));
              if (hasPrevious) {
                return String(previousSelectedAId);
              }

              return String(as[0].id);
            });
          } catch (err) {
            setError(err.message || 'Onbekende fout bij ophalen data');
            setResponseData(null);
            setRegistratieData(null);
            setOngedaanGemaakteRegistratieData(null);
            setSelectedAId('');
          } finally {
            setLoading(false);
          }
        }

        function incrementTAndReload() {
          const currentT = Number(t) || 0;
          const nextT = currentT + 1;
          setT(nextT);
          loadData(nextT);
        }

        function decrementTAndReload() {
          const currentT = Number(t) || 0;
          const nextT = Math.max(0, currentT - 1);
          setT(nextT);
          loadData(nextT);
        }

        useEffect(() => {
          loadData();
        }, []);

        useEffect(() => {
          function handleKeyDown(event) {
            const tagName = event.target?.tagName || '';
            if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA') {
              return;
            }

            if (event.key === 'ArrowRight') {
              event.preventDefault();
              incrementTAndReload();
            }

            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              decrementTAndReload();
            }
          }

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [t, loading, baseUrl]);

        const as = safeArray(responseData?.As);

        const selectedA = useMemo(() => {
          return as.find((item) => String(item.id) === String(selectedAId)) || null;
        }, [as, selectedAId]);

        const us = safeArray(selectedA?.us);
        const vs = safeArray(selectedA?.vs);
        const selectedRegistratie = registratieData;
        const selectedRegistratieWijzigingen = safeArray(registratieData?.wijzigingen);
        const isOngedaanmaking = selectedRegistratie?.registratietype === 'ongedaanmaking';
        const ongedaanGemaakteWijzigingen = safeArray(ongedaanGemaakteRegistratieData?.wijzigingen);
        const visualRegistratie = isOngedaanmaking ? ongedaanGemaakteRegistratieData : selectedRegistratie;
        const visualWijzigingen = isOngedaanmaking ? ongedaanGemaakteWijzigingen : selectedRegistratieWijzigingen;
        const registratieTitel = selectedRegistratie?.registratietype
          ? selectedRegistratie.registratietype.charAt(0).toUpperCase() + selectedRegistratie.registratietype.slice(1)
          : 'Registratie';

        return (
          <div className="container">
            <h1>Bitemporal visualizer</h1>
            <p className="muted">
              Kies een peilmoment en een entiteit A. De visualisatie laat A met gekoppelde U- en V-representaties zien.
            </p>
            <p className="muted">Tip: gebruik ← voor t - 1 en → voor t + 1.</p>

            <div className="card">
              <div className="controls">
                <label>
                  API base URL
                  <input
                    value={baseUrl}
                    onChange={(e) => setBaseUrl(e.target.value.trim())}
                    placeholder="http://localhost:8080"
                  />
                </label>

                <label>
                  Peilmoment (t)
                  <input
                    type="number"
                    value={t}
                    onChange={(e) => setT(e.target.value)}
                    min="0"
                    step="1"
                  />
                </label>

                <label>
                  Entiteit A
                  <select
                    value={selectedAId}
                    onChange={(e) => setSelectedAId(e.target.value)}
                    disabled={as.length === 0}
                  >
                    {as.length === 0 && <option value="">Geen resultaten</option>}
                    {as.map((a) => (
                      <option key={a.id} value={a.id}>
                        A #{a.id}
                      </option>
                    ))}
                  </select>
                </label>
              </div>

              <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                <button onClick={loadData} disabled={loading}>
                  {loading ? 'Bezig met ophalen...' : 'Ophalen'}
                </button>
                <button onClick={decrementTAndReload} disabled={loading || Number(t) <= 0}>
                  t - 1 en ophalen
                </button>
                <button onClick={incrementTAndReload} disabled={loading}>
                  t + 1 en ophalen
                </button>
              </div>

              {error && <p style={{ color: '#dc2626' }}>Fout: {error}</p>}
              {responseData?.has_more && (
                <p className="muted">Let op: has_more=true, niet alle A-entiteiten zijn geladen.</p>
              )}
            </div>

            <div className="row" style={{ marginTop: 16 }}>
              <div className="card">
                <h2>{registratieTitel}</h2>

                {!selectedRegistratie ? (
                  <p className="muted">Geen registratie met id=t gevonden.</p>
                ) : (
                  <>
                    <p className="muted" style={{ margin: 0 }}>
                      id={selectedRegistratie.id} | type={selectedRegistratie.registratietype} | tijdstip={selectedRegistratie.tijdstip}
                    </p>

                    <h3 style={{ marginTop: 12 }}>Visueel</h3>
                    {!visualRegistratie ? (
                      <p className="muted">Geen registratie om te visualiseren.</p>
                    ) : (
                      <svg className="graph" viewBox="0 0 760 420" preserveAspectRatio="xMidYMid meet">
                        <g>
                          <rect className="node" x="220" y="30" rx="10" width="320" height="72" style={{ fill: '#ecfeff' }} />
                          <text className="label" x="236" y="57">Reg id={visualRegistratie.id} | type={visualRegistratie.registratietype}</text>
                          <text className="label" x="236" y="80">tijdstip={visualRegistratie.tijdstip}</text>
                        </g>

                        {visualWijzigingen.map((w, index) => {
                          const y = 150 + index * 84;
                          return (
                            <g key={`vwz-${w.id || index}`}>
                              <line className="edge" x1="380" y1="102" x2="380" y2={y - 12} />
                              <rect className="node" x="90" y={y} rx="8" width="580" height="62" style={{ fill: wijzigingKleur(w.wijzigingstype) }} />
                              <text className="label" x="106" y={y + 24}>{`${w.wijzigingstype} | entiteit=${w.entiteitnaam}:${w.entiteit_id}`}</text>
                              <text className="label" x="106" y={y + 46}>{`rep=${w.representatienaam || '-'}:${w.representatie_id || '-'}`}</text>
                            </g>
                          );
                        })}

                        {visualWijzigingen.length === 0 && (
                          <text className="label" x="230" y="170">Geen wijzigingen onder deze registratie</text>
                        )}
                      </svg>
                    )}

                    {isOngedaanmaking ? (
                      <>
                        <h3 style={{ marginTop: 12 }}>Ongedaan gemaakte registratie</h3>
                        {!ongedaanGemaakteRegistratieData ? (
                          <p className="muted">Doelregistratie niet gevonden.</p>
                        ) : (
                          <>
                            <p className="muted" style={{ margin: 0 }}>
                              id={ongedaanGemaakteRegistratieData.id} | type={ongedaanGemaakteRegistratieData.registratietype} | tijdstip={ongedaanGemaakteRegistratieData.tijdstip}
                            </p>
                            <h3 style={{ marginTop: 12 }}>Wijzigingen onder doelregistratie</h3>
                            <ul>
                              {ongedaanGemaakteWijzigingen.length === 0 && <li>Geen wijzigingen onder deze doelregistratie</li>}
                              {ongedaanGemaakteWijzigingen.map((w, index) => (
                                <li key={`wz-doel-${w.id || index}`}>
                                  {w.wijzigingstype} | entiteit={w.entiteitnaam}:{w.entiteit_id} | rep={w.representatienaam || '-'}:{w.representatie_id || '-'}
                                </li>
                              ))}
                            </ul>
                          </>
                        )}
                      </>
                    ) : (
                      <>
                        <h3 style={{ marginTop: 12 }}>Wijzigingen</h3>
                        <ul>
                          {selectedRegistratieWijzigingen.length === 0 && <li>Geen wijzigingen onder deze registratie</li>}
                          {selectedRegistratieWijzigingen.map((w, index) => (
                            <li key={`wz-${w.id || index}`}>
                              {w.wijzigingstype} | entiteit={w.entiteitnaam}:{w.entiteit_id} | rep={w.representatienaam || '-'}:{w.representatie_id || '-'}
                            </li>
                          ))}
                        </ul>
                      </>
                    )}
                  </>
                )}
              </div>

              <div className="card">
                <h2>Representaties</h2>
                {!selectedA ? (
                  <p className="muted">Geen entiteit geselecteerd.</p>
                ) : (
                  <svg className="graph" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet">
                    {us.map((u, i) => {
                      const y = 80 + i * 90;
                      return (
                        <g key={`u-${u.rel_id || i}`}>
                          <line className="edge" x1="300" y1="190" x2="180" y2={y} />
                          <rect className="node" x="60" y={y - 30} rx="8" width="240" height="60" />
                          <text className="label" x="72" y={y - 8}>U rel_id={u.rel_id ?? '-'}</text>
                          <text className="label" x="72" y={y + 12}>{`${u.aaa ?? ''} | ${u.bbb ?? ''}`}</text>
                        </g>
                      );
                    })}

                    <g>
                      <rect className="node" x="330" y="150" rx="10" width="240" height="80" style={{ fill: '#dbeafe' }} />
                      <text className="label" x="345" y="182">A id={selectedA.id}</text>
                      <text className="label" x="345" y="205">opvoer={selectedA.opvoer}</text>
                    </g>

                    {vs.map((v, i) => {
                      const y = 80 + i * 90;
                      return (
                        <g key={`v-${v.rel_id || i}`}>
                          <line className="edge" x1="570" y1="190" x2="690" y2={y} />
                          <rect className="node" x="690" y={y - 30} rx="8" width="180" height="60" />
                          <text className="label" x="700" y={y - 6}>V rel_id={v.rel_id ?? '-'}</text>
                          <text className="label" x="700" y={y + 14}>ccc={v.ccc ?? ''}</text>
                        </g>
                      );
                    })}
                  </svg>
                )}
              </div>
            </div>

            <div className="row">
              <div className="card">
                <h3>U-details</h3>
                <ul>
                  {us.length === 0 && <li>Geen U records</li>}
                  {us.map((u, index) => (
                    <li key={`ud-${u.rel_id || index}`}>
                      rel_id={u.rel_id ?? '-'} | aaa={u.aaa ?? '-'} | bbb={u.bbb ?? '-'} | opvoer={u.opvoer ?? '-'}
                    </li>
                  ))}
                </ul>
              </div>

              <div className="card">
                <h3>V-details</h3>
                <ul>
                  {vs.length === 0 && <li>Geen V records</li>}
                  {vs.map((v, index) => (
                    <li key={`vd-${v.rel_id || index}`}>
                      rel_id={v.rel_id ?? '-'} | ccc={v.ccc ?? '-'} | opvoer={v.opvoer ?? '-'}
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
