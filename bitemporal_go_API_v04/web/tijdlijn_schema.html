<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema-Driven Tijdlijn</title>
    <style>
      :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f8fafc; color: #0f172a; }
      .container { max-width: 1700px; margin: 0 auto; padding: 20px; }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
      .controls { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 12px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
      input, select, button { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 14px; }
      button { background: #0f172a; color: #fff; cursor: pointer; }
      .muted { color: #475569; font-size: 13px; }
      .timeline { margin-top: 12px; overflow-x: auto; }
      .row { display: inline-flex; gap: 12px; }
      .col { min-width: 340px; display: grid; gap: 10px; }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      h2 { margin: 0 0 8px; font-size: 17px; }
      @media (max-width: 900px) { .controls { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      function safeArray(v) { return Array.isArray(v) ? v : []; }
      function normInt(v, fallback = 0) {
        const n = Number.parseInt(String(v), 10);
        return Number.isNaN(n) ? fallback : Math.max(0, n);
      }

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return await res.json();
      }

      function tUitRegistratieTijdstip(raw) {
        if (!raw) return null;
        const ts = Date.parse(raw);
        const base = Date.parse("2026-01-01T00:00:00Z");
        if (Number.isNaN(ts) || Number.isNaN(base)) return null;
        return Math.max(0, Math.round((ts - base) / (60 * 60 * 1000)));
      }

      function endpointSegmentForEntityType(typeName) {
        return `${String(typeName || "").toLowerCase()}s`;
      }

      function App() {
        const [baseUrl, setBaseUrl] = useState(window.location.origin);
        const [schema, setSchema] = useState(null);
        const [schemaError, setSchemaError] = useState("");
        const [entityType, setEntityType] = useState("A");
        const [entityId, setEntityId] = useState(1);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [items, setItems] = useState([]);

        const entityTypes = useMemo(() => safeArray(schema?.types).filter((x) => String(x.metatype) === "entiteit"), [schema]);

        useEffect(() => {
          let cancelled = false;
          async function loadSchema() {
            setSchemaError("");
            try {
              const json = await fetchJson(`${baseUrl}/api/viz/schema`);
              if (!cancelled) {
                setSchema(json);
                const first = safeArray(json?.types).find((x) => String(x.metatype) === "entiteit");
                if (first) setEntityType((prev) => prev || first.typenaam);
              }
            } catch (err) {
              if (!cancelled) {
                setSchema(null);
                setSchemaError(err instanceof Error ? err.message : String(err));
              }
            }
          }
          loadSchema();
          return () => { cancelled = true; };
        }, [baseUrl]);

        async function loadTimeline() {
          setLoading(true);
          setError("");
          try {
            const regRes = await fetchJson(`${baseUrl}/full/registraties?page=1&size=100`);
            const registraties = safeArray(regRes?.Registraties);
            const seg = endpointSegmentForEntityType(entityType);
            const id = normInt(entityId, 0);

            const verrijkt = [];
            for (const reg of registraties) {
              const t = tUitRegistratieTijdstip(reg?.tijdstip);
              let snapshot = null;
              if (t !== null) {
                const res = await fetch(`${baseUrl}/full/${seg}/${encodeURIComponent(id)}?t=${encodeURIComponent(t)}`);
                if (res.ok) {
                  snapshot = await res.json();
                }
              }
              verrijkt.push({ reg, t, snapshot });
            }

            verrijkt.sort((a, b) => {
              const at = Date.parse(a.reg?.tijdstip || "");
              const bt = Date.parse(b.reg?.tijdstip || "");
              if (Number.isNaN(at) || Number.isNaN(bt)) return Number(a.reg?.id || 0) - Number(b.reg?.id || 0);
              if (at !== bt) return at - bt;
              return Number(a.reg?.id || 0) - Number(b.reg?.id || 0);
            });

            setItems(verrijkt);
          } catch (err) {
            setError(err instanceof Error ? err.message : String(err));
            setItems([]);
          } finally {
            setLoading(false);
          }
        }

        return (
          <div className="container">
            <h1>Schema-driven tijdlijn (prototype)</h1>
            <p className="muted"><a className="muted" href="/viz/tijdlijn.html">Terug naar huidige tijdlijn</a> | <a className="muted" href="/viz/index_schema.html">Open schema-index</a></p>
            <p className="muted">
              {schemaError
                ? `Schema niet geladen: ${schemaError}`
                : `Schema: ${schema?.versie || "-"} | entiteittypen: ${entityTypes.length}`}
            </p>

            <div className="card">
              <div className="controls">
                <label>
                  API base URL
                  <input value={baseUrl} onChange={(e) => setBaseUrl(e.target.value.trim())} />
                </label>
                <label>
                  Entiteittype
                  <select value={entityType} onChange={(e) => setEntityType(e.target.value)}>
                    {entityTypes.map((et) => <option key={et.typenaam} value={et.typenaam}>{et.typenaam}</option>)}
                  </select>
                </label>
                <label>
                  Entiteit-id
                  <input type="number" min="0" step="1" value={entityId} onChange={(e) => setEntityId(e.target.value)} />
                </label>
                <div style={{ alignSelf: "end" }}>
                  <button onClick={loadTimeline} disabled={loading}>{loading ? "Bezig..." : "Ophalen tijdlijn"}</button>
                </div>
              </div>
              {error && <p style={{ color: "#dc2626" }}>Fout: {error}</p>}
            </div>

            <div className="timeline">
              <div className="row">
                {items.map((item, idx) => (
                  <div className="col" key={`col-${item.reg?.id || idx}`}>
                    <div className="card">
                      <h2>Registratie {item.reg?.id ?? "-"}</h2>
                      <p className="muted">type={item.reg?.registratietype || "-"} | t={item.t ?? "-"}</p>
                      <pre>{JSON.stringify(item.reg || {}, null, 2)}</pre>
                    </div>
                    <div className="card">
                      <h2>Snapshot {entityType} #{normInt(entityId, 0)}</h2>
                      <pre>{JSON.stringify(item.snapshot || null, null, 2)}</pre>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
