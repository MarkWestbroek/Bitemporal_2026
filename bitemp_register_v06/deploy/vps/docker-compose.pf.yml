# docker-compose.pf.yml — tweede Omnium-instantie op pf.common-ground-lab.nl
#
# Opdracht: docs/plans/2026-09-21 Opdracht tweede instantie pf.common-ground-lab.nl
# (werkpakket C). Volledig los van de stack in docker-compose.vps.yml: eigen
# containernamen, netwerk, volumes, Postgres, MinIO en geheimen. Alleen loopback-
# poorten; Caddy zet er HTTPS voor.
#
#   frontend → 127.0.0.1:8084    postgres → 127.0.0.1:5435    minio-console → 127.0.0.1:9002
#
# Images worden OP DE VPS gebouwd uit de checkout (besluit Mark, 22 september
# 2026): een testinstantie, dus niets naar Docker Hub en `latest` blijft staan —
# app.omnium-ide.nl draait op :latest en mag hier niets van merken (plan §3a).
# De API is een productie-build (geen -tags devtools): geen /admin/-routes.
#
# Alles via docker compose met projectnaam omnium-pf, vanuit /srv/omnium-pf:
#   docker compose -p omnium-pf -f src/bitemp_register_v06/deploy/vps/docker-compose.pf.yml \
#                  --env-file .env <commando>
# (zie deploy/vps/pf.sh voor de gebruikelijke handelingen)

name: omnium-pf

services:

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: pf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER ontbreekt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pf_register}
    ports:
      - "127.0.0.1:${PG_PORT:-5435}:5432"   # alleen loopback: backups + SSH-tunnel
    volumes:
      - pf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-pf_register}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pf_net]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: pf-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY ontbreekt in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY ontbreekt in .env}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9002}:9001"   # console alleen via SSH-tunnel
    volumes:
      - pf_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pf_net]

  minio-init:
    image: minio/mc:latest
    container_name: pf-minio-init
    restart: "no"
    profiles: ["init"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      echo 'Bucket $${MINIO_BUCKET} aangemaakt of bestond al.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ide-bestanden}
    networks: [pf_net]

  api:
    image: omnium-pf-api:${PF_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile.api
      args:
        COMMIT: ${PF_TAG:-local}
        BUILD_TIME: ${BUILD_TIME:-dev}
    container_name: pf-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pf_register}?sslmode=disable
      APP_ENV: production
      GIN_MODE: release
      BUNDEBUG: "0"
      APP_DEBUG_LOGS: "0"
      ALLOW_DROP_TABLES: "false"
      # Verplicht in de compose, maar zonder functie in een productie-build (plan §3a).
      ADMIN_DROP_PASSWORD: ${ADMIN_DROP_PASSWORD:?ADMIN_DROP_PASSWORD ontbreekt in .env}
      AUTO_CREATE_DATABASE: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-ide-bestanden}
      MINIO_USE_SSL: "false"
      AUTH_ENABLED: "true"
      # Openbare indiening: FormulierDefinitie 2 "Aanmelding initiatief" (POST /aanmelding/2, aanmelden.html?formulier=2)
      OPENBARE_FORMULIEREN: "2"
      # Notificaties (NORA/FDS, CloudEvents): source-URN en SMTP komen uit /srv/omnium-pf/.env
      NOTIFICATIE_SOURCE: "${NOTIFICATIE_SOURCE:-}"
      NOTIFICATIE_TYPE_PREFIX: "nl.commonground-portfolio"
      NOTIFICATIE_BASIS_URL: "https://pf.common-ground-lab.nl"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ontbreekt in .env}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD ontbreekt in .env}
      # Een live register: echte kloktijden. "synthetisch" (de default van de API)
      # leidt tijdstippen af van het registratie-ID — mooi voor demo's, niet voor
      # een echt register (besluit Mark, 22 september 2026).
      REGISTRATIE_TIJD: ${REGISTRATIE_TIJD:-klok}
      # OpenFTV pas na de iframe-test (werkpakket F).
      AUTHZ_PDP_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [pf_net]

  frontend:
    image: omnium-pf-frontend:${PF_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
    container_name: pf-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # De eigen API van dit compose-project (werkpakket A).
      API_UPSTREAM: http://api:8080
      # Voor de iframe-test: iedereen mag inbedden. Later beperken tot de
      # Pleio-site (bv. "https://commonground.nl https://*.commonground.nl").
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:-*}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8084}:80"
    networks: [pf_net]

volumes:
  pf_postgres_data:
  pf_minio_data:

networks:
  pf_net:
    driver: bridge
