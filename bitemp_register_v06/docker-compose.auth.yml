# docker-compose voor OpenFTV autorisatie-sidecar
# Gebruikt samen met de bitemp_register_v06 API.
#
# Start met: docker compose -f docker-compose.auth.yml up
# (geen --build nodig: gebruikt pre-built images van GitLab registry)
#
# Pre-built images: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/eam/
# Lokaal bouwen: docker compose -f docker-compose.auth.yml up --build (vereist ../../open-ftv checkout)
#
# Poorten:
#   9010: OpenFTV Manager (PAP+PIP) — HTTPS API  (9000 bezet door Minio)
#   9110: OpenFTV Manager — bundle endpoint (intern, voor PDP)
#   8110: OpenFTV Manager — health endpoint
#   9004: OpenFTV PDP — AuthZEN evaluatie endpoint (HTTPS)
#   8104: OpenFTV PDP — health endpoint
#   8180: OpenFTV Management Interface (web UI)
#   5400: OpenFTV PostgreSQL database

services:
  openftv-db:
    image: postgres:15
    container_name: bitemp-openftv-db
    ports:
      - "5400:5432"
    environment:
      POSTGRES_USER: openftv
      POSTGRES_PASSWORD: openftv
      POSTGRES_DB: openftv
    volumes:
      - openftv-postgres-data:/var/lib/postgresql/data
      - ./authz/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openftv -d openftv"]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 2s
    networks:
      - bitemp-auth

  openftv-manager:
    image: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/eam/manager:2.2.3
    container_name: bitemp-openftv-manager
    ports:
      - "9010:8443"
      - "9110:9443"
      - "8110:8080"
    environment:
      - MANAGER_PERSIST_TYPE=postgres
      - MANAGER_PERSIST_POSTGRES_URL=postgres://openftv:openftv@openftv-db:5432/openftv?sslmode=disable
      - MANAGER_MIGRATE_AUTO=true
      - MANAGER_MIGRATE_SOURCE=*embed*
      - MANAGER_POLICIES_LANGUAGE=rego
      - MANAGER_POLICIES_STORE=/tmp/data/policies
      - MANAGER_POLICIES_STORE_RECURSE=true
      - MANAGER_PIP_STORE=/tmp/data/data
      - MANAGER_PIP_STORE_RECURSE=true
      - MANAGER_TAGS_PATH=/tmp/data/tags
      - MANAGER_AUTHENTICATION_TYPE=none
      - MANAGER_BUNDLE_CONFIGS=/tmp/data/bundles
      - MANAGER_BUNDLE_RECURSE=true
      - MANAGER_BUNDLE_SEND_TIMEOUT=60s
      - MANAGER_ADL_TYPE=postgresql
      - MANAGER_ADL_SERVICE_NAME=bitemp-register
      - MANAGER_ADL_PG_URL=postgres://openftv:openftv@openftv-db:5432/openftv_adl?sslmode=disable
    depends_on:
      openftv-db:
        condition: service_healthy
    volumes:
      - ./authz/manager:/tmp/data
    networks:
      - bitemp-auth
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz > /dev/null 2>&1 || exit 1"]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 5s

  openftv-pdp:
    image: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/eam/pdp:2.2.3
    container_name: bitemp-openftv-pdp
    ports:
      - "9004:8443"
      - "9104:9443"
      - "8104:8080"
    environment:
      - PDP_BUNDLE_MANAGER=http://openftv-manager:9443/v1/bundle/bitemp-pdp
      - PDP_BUNDLE_ENCODING=bzip2
      - PDP_BUNDLE_TIMEOUT=30s
      - PDP_BUNDLE_RETRIES=5
      - PDP_POLICIES_LANGUAGE=rego
      - PDP_ADL_TYPE=postgresql
      - PDP_ADL_SERVICE_NAME=bitemp-register
      - PDP_ADL_PG_URL=postgres://openftv:openftv@openftv-db:5432/openftv_adl?sslmode=disable
      - PDP_MIGRATE_AUTO=true
      - PDP_MIGRATE_SOURCE=*embed*
    depends_on:
      openftv-manager:
        condition: service_healthy
    volumes:
      - ./authz/pdp:/tmp/data
    networks:
      - bitemp-auth
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/livez > /dev/null 2>&1 || exit 1"]
      interval: 4s
      timeout: 10s
      retries: 5
      start_period: 5s

  openftv-mi:
    image: registry.gitlab.com/digilab.overheid.nl/ecosystem/ftv/open-ftv/eam/management-interface:2.2.3
    container_name: bitemp-openftv-mi
    environment:
      VITE_PAP_BASE_URL: "http://localhost:9010"
      VITE_PIP_BASE_URL: "http://localhost:9010"
    ports:
      - "8180:8080"
    depends_on:
      openftv-manager:
        condition: service_healthy
    networks:
      - bitemp-auth

volumes:
  openftv-postgres-data:

networks:
  bitemp-auth:
    driver: bridge
