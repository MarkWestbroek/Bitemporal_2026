            type: object
        WijzigingRequest:
            description: 'Een wijziging bevat een opvoer en/of een afvoer. De waarde is een object met exact één sleutel: de veldnaam van het representatietype (bijv. "natuurlijkpersoon", "naam", "burgerschap").'
