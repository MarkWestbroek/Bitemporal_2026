            description: 'Weergavedefinitie voor publicatie-views op entiteitsdata. Bevat metadata (naam, doeltype, status), een tabelconfiguratie (kolommen, sortering) en een detail-template met veldpad-inserts. Bitemporeel: wijzigingen zijn traceerbaar en corrigeerbaar via registraties.'
            properties:
                id:
                    format: int32
                    type: integer
            required:
                - id
            type: object
        WeergaveDefinitie_Aanvang:
            description: Aanvangsdatum van WeergaveDefinitie.
            properties:
                datum:
                    format: date
                    type: string
                versie:
                    format: int64
                    type: integer
                weergavedefinitie_id:
                    format: int32
                    type: integer
            required:
                - weergavedefinitie_id
            type: object
        WeergaveDefinitie_DetailTemplate:
            description: Template voor de detail-pagina met {{veldpad}} inserts. Wordt gerenderd als read-only publicatieweergave.
            properties:
                definitie_versie:
                    type: string
                rel_id:
                    format: int32
                    type: integer
                template_tekst:
                    type: string
                weergavedefinitie_id:
                    format: int32
                    type: integer
            required:
                - weergavedefinitie_id
                - rel_id
                - template_tekst
                - definitie_versie
            type: object
        WeergaveDefinitie_DetailTemplate_Data:
            description: Geversioned inhoud van WeergaveDefinitie_DetailTemplate.
            properties:
                definitie_versie:
                    type: string
