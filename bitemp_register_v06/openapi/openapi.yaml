                    format: double
                    type: number
                heel:
                    format: int32
                    type: integer
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
                - rel_id
                - float
                - heel
            type: object
        A_W_Einde:
            description: Einddatum van A_W.
            properties:
                a_id:
                    format: int32
                    type: integer
                datum:
                    format: date
                    type: string
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
                - rel_id
            type: object
