components:
    schemas:
        A:
            description: Entiteit A met materiele tijdlijn en onderliggende representaties U, V, W en Rel_A_B.
            properties:
                id:
                    format: int32
                    type: integer
            required:
                - id
            type: object
        A_Aanvang:
            description: Aanvangsdatum van A.
            properties:
                a_id:
                    format: int32
                    type: integer
                datum:
                    format: date
                    type: string
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
            type: object
        A_Einde:
            description: Einddatum van A.
            properties:
                a_id:
                    format: int32
                    type: integer
                datum:
                    format: date
                    type: string
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
            type: object
        A_U:
            description: Enkelvoudig gegevenselement van A met formele tijdlijn.
            properties:
                a_id:
                    format: int32
                    type: integer
                aaa:
                    type: string
                bbb:
                    type: boolean
                rel_id:
                    format: int32
                    type: integer
            required:
                - a_id
                - rel_id
                - aaa
            type: object
        A_U_Data:
            description: Geversioned inhoud van A_U.
            properties:
                a_id:
                    format: int32
                    type: integer
                aaa:
                    type: string
                bbb:
                    type: boolean
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
                - rel_id
                - aaa
            type: object
        A_V:
            description: Meervoudig gegevenselement van A met onder andere een datumveld.
            properties:
                a_id:
                    format: int32
                    type: integer
                ccc:
                    type: string
                ddd:
                    type: string
                eee:
                    type: string
                fff:
                    format: double
                    type: number
                ggg:
                    enum:
                        - Optie A
                        - Optie B
                        - Optie C
                    type: string
                rel_id:
                    format: int32
                    type: integer
            required:
                - a_id
                - rel_id
                - ccc
                - fff
                - ggg
            type: object
        A_V_Data:
            description: Geversioned inhoud van A_V.
            properties:
                a_id:
                    format: int32
                    type: integer
                ccc:
                    type: string
                ddd:
                    type: string
                eee:
                    type: string
                fff:
                    format: double
                    type: number
                ggg:
                    enum:
                        - Optie A
                        - Optie B
                        - Optie C
                    type: string
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
                - rel_id
                - ccc
                - fff
                - ggg
            type: object
        A_W:
            description: Meervoudig gegevenselement van A met numerieke waarden.
            properties:
                a_id:
                    format: int32
                    type: integer
                aanvang:
                    format: date
                    type: string
                einde:
                    format: date
                    type: string
                float:
                    format: double
                    type: number
                heel:
                    format: int32
                    type: integer
                rel_id:
                    format: int32
                    type: integer
            required:
                - a_id
                - rel_id
                - float
                - heel
            type: object
        A_W_Aanvang:
            description: Aanvangsdatum van A_W.
            properties:
                a_id:
                    format: int32
                    type: integer
                datum:
                    format: date
                    type: string
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - a_id
                - rel_id
            type: object
        A_W_Data:
            description: Geversioned inhoud van A_W.
            properties:
                a_id:
                    format: int32
                    type: integer
