                formulierdefinitie_id:
                    format: int32
                    type: integer
                layout_json:
                    type: string
                rel_id:
                    format: int32
                    type: integer
            required:
                - formulierdefinitie_id
                - rel_id
                - layout_json
                - definitie_versie
            type: object
        FormulierDefinitie_Layout_Data:
