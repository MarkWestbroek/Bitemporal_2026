components:
    schemas:
        FormulierDefinitie:
            description: 'Formulierdefinitie voor custom layouts van entiteitsformulieren. Bevat metadata (naam, status, doeltype) en een JSON layout-boom. Bitemporeel: wijzigingen zijn traceerbaar en corrigeerbaar via registraties.'
            properties:
                id:
                    format: int32
                    type: integer
            required:
                - id
            type: object
        FormulierDefinitie_Aanvang:
            description: Aanvangsdatum van FormulierDefinitie.
            properties:
                datum:
                    format: date
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - formulierdefinitie_id
            type: object
        FormulierDefinitie_Einde:
            description: Einddatum van FormulierDefinitie.
            properties:
                datum:
                    format: date
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - formulierdefinitie_id
            type: object
        FormulierDefinitie_Layout:
            description: De layout-boom van het formulier als JSON-structuur. Bevat groepen, rijen, velden en conditionele elementen.
            properties:
                definitie_versie:
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                layout_json:
                    type: string
                rel_id:
                    format: int32
                    type: integer
            required:
                - formulierdefinitie_id
                - rel_id
                - layout_json
                - definitie_versie
            type: object
        FormulierDefinitie_Layout_Data:
            description: Geversioned inhoud van FormulierDefinitie_Layout.
            properties:
                definitie_versie:
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                layout_json:
                    type: string
                rel_id:
                    format: int32
                    type: integer
                versie:
                    format: int64
                    type: integer
            required:
                - formulierdefinitie_id
                - rel_id
                - layout_json
                - definitie_versie
            type: object
        FormulierDefinitie_Meta:
            description: 'Metadata van de formulierdefinitie: naam, beschrijving, doeltype en status.'
            properties:
                beschrijving:
                    type: string
                doeltype:
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                is_standaard:
                    type: boolean
                naam:
                    type: string
                rel_id:
                    format: int32
                    type: integer
                status:
                    enum:
                        - concept
                        - actief
                        - inactief
                    type: string
            required:
                - formulierdefinitie_id
                - rel_id
                - naam
                - beschrijving
                - doeltype
                - status
            type: object
        FormulierDefinitie_Meta_Data:
            description: Geversioned inhoud van FormulierDefinitie_Meta.
            properties:
                beschrijving:
                    type: string
                doeltype:
                    type: string
                formulierdefinitie_id:
                    format: int32
                    type: integer
                is_standaard:
                    type: boolean
                naam:
                    type: string
                rel_id:
                    format: int32
                    type: integer
                status:
                    enum:
                        - concept
                        - actief
                        - inactief
                    type: string
                versie:
                    format: int64
                    type: integer
            required:
                - formulierdefinitie_id
                - rel_id
                - naam
                - beschrijving
                - doeltype
                - status
            type: object
