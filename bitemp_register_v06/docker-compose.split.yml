# docker-compose.split.yml — gesplitste deployment met aparte backend- en frontend-image.
#
# Laat de bestaande compose-bestanden intact en biedt daarnaast een extra stack met:
#   - PostgreSQL
#   - aparte Go backend-image
#   - aparte nginx/Vite frontend-image
#
# Starten:
#   docker compose -f docker-compose.split.yml up --build
#
# Standaard URLs:
#   Frontend: http://localhost:${FRONTEND_PORT:-8083}/viz/react/
#   API:      http://localhost:${API_PORT:-8082}/

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: bitemp-postgres-v06-split
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-bitemp_go_db_v06}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres_data_split:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bitemp_go_db_v06}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitemp_split_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        COMMIT: ${COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-dev}
    image: ${API_IMAGE:-bitemp-go-api:v06-split}
    container_name: bitemp-go-api-v06-split
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB:-bitemp_go_db_v06}?sslmode=${DB_SSLMODE:-disable}
      APP_ENV: ${APP_ENV:-production}
      GIN_MODE: ${GIN_MODE:-release}
      ALLOW_DROP_TABLES: ${ALLOW_DROP_TABLES:-false}
      ADMIN_DROP_PASSWORD: ${ADMIN_DROP_PASSWORD:-1234}
      AUTO_CREATE_DATABASE: ${AUTO_CREATE_DATABASE:-false}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ide-bestanden}
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8082}:8080"
    networks:
      - bitemp_split_network

  minio:
    image: minio/minio:latest
    container_name: bitemp-minio-v06-split
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data_split:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitemp_split_network

  minio-init:
    image: minio/mc:latest
    container_name: bitemp-minio-init-v06-split
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-ide-bestanden};
      echo 'Bucket $${MINIO_BUCKET:-ide-bestanden} aangemaakt of bestond al.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ide-bestanden}
    networks:
      - bitemp_split_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Laat leeg voor same-origin via nginx proxy naar de api-service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ${FRONTEND_IMAGE:-bitemp-viz-frontend:v06-split}
    container_name: bitemp-viz-frontend-v06
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8083}:80"
    networks:
      - bitemp_split_network

volumes:
  postgres_data_split:
  minio_data_split:

networks:
  bitemp_split_network:
    driver: bridge
