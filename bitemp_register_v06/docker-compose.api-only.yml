services:
  bitemp-go-api:
    image: ${API_IMAGE:-markwestbroek/bitemp-go-api:v05}
    container_name: bitemp-go-api-v06
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${API_PORT:-8082}:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@${DB_HOST:-bitemp-postgres-v06}:${DB_PORT:-5432}/${POSTGRES_DB:-bitemp_go_db_v06}?sslmode=${DB_SSLMODE:-disable}"
      APP_ENV: "${APP_ENV:-production}"
      GIN_MODE: "${GIN_MODE:-release}"
      ALLOW_DROP_TABLES: "${ALLOW_DROP_TABLES:-false}"
      ADMIN_DROP_PASSWORD: "${ADMIN_DROP_PASSWORD:-change-me}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-bitemp-minio-v06:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-ide-bestanden}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
    networks:
      - bitemp-net

networks:
  bitemp-net:
    name: bitemp-net
