<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Het ecosysteem rond een initiatief: vijf organisatietypen in een cirkel (straal 160 om
       300,220; cirkels r 58). Voorbeeldafbeelding voor de vorm image-map op een lijst. -->
  <rect width="600" height="440" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5">
    <line x1="300" y1="220" x2="300" y2="60"/>
    <line x1="300" y1="220" x2="452" y2="171"/>
    <line x1="300" y1="220" x2="394" y2="349"/>
    <line x1="300" y1="220" x2="206" y2="349"/>
    <line x1="300" y1="220" x2="148" y2="171"/>
  </g>
  <circle cx="300" cy="220" r="62" fill="#6366f1"/>
  <text x="300" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Initiatief</text>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">
    <circle cx="300" cy="60"  r="58" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="300" y="65">Gemeenten</text>
    <circle cx="452" cy="171" r="58" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="452" y="176">Leveranciers</text>
    <circle cx="394" cy="349" r="58" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/><text x="394" y="354">VNG</text>
    <circle cx="206" cy="349" r="58" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="206" y="354">Ketenpartners</text>
    <circle cx="148" cy="171" r="58" fill="#cffafe" stroke="#22d3ee" stroke-width="2"/><text x="148" y="176">Rijk</text>
  </g>
</svg>
