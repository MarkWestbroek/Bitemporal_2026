<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<!-- Bron voor og-square.png (1200×1200) — Instagram / vierkante preview. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 1200px; }
  .og {
    position: relative; width: 1200px; height: 1200px; overflow: hidden;
    background: #0c0d12; color: #e7e8ef; font-family: Inter, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }
  .og::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(760px 620px at 50% 4%, rgba(99,102,241,.42), transparent 66%),
      radial-gradient(620px 520px at 10% 14%, rgba(34,211,238,.22), transparent 70%),
      radial-gradient(620px 520px at 90% 12%, rgba(139,92,246,.26), transparent 70%);
  }
  .og::after {
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(820px 820px at 50% 46%, #000, transparent 75%);
  }
  .inner { position: relative; z-index: 1; padding: 0 90px; }
  .mark { width: 240px; height: 240px; margin: 0 auto 44px; display:block; filter: drop-shadow(0 18px 60px rgba(99,102,241,.5)); }
  .word { font-size: 104px; font-weight: 800; letter-spacing: -3px; line-height: 1; margin-bottom: 40px; }
  .word .sub { font-weight: 300; color: #aeb6cf; margin-left: 10px; }
  h1 { font-size: 56px; font-weight: 700; letter-spacing: -1.4px; line-height: 1.16; max-width: 17ch; margin: 0 auto 48px; color:#c7cde0; }
  h1 .grad { background: linear-gradient(110deg,#60a5fa,#818cf8,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; }
  .tags { display:flex; gap: 16px; justify-content:center; flex-wrap:wrap; max-width: 900px; margin: 0 auto; }
  .tag {
    font-size: 26px; font-weight: 600; color: #c7cde0; padding: 12px 24px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); display:flex; align-items:center; gap:12px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 0 16px currentColor; }
  .strip { position:absolute; left:0; right:0; bottom:0; height:12px; background: linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6,#22d3ee); z-index:1; }
</style>
</head>
<body>
<div class="og">
  <div class="inner">
    <svg class="mark" viewBox="0 0 48 48" aria-label="Omnium Studio">
      <defs>
        <linearGradient id="sq-ring" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
        <linearGradient id="sq-hub" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
      </defs>
      <g stroke="url(#sq-ring)" stroke-width="1.1" opacity="0.35" stroke-linecap="round">
        <line x1="24" y1="24" x2="24" y2="6"/><line x1="24" y1="24" x2="39.59" y2="15"/>
        <line x1="24" y1="24" x2="39.59" y2="33"/><line x1="24" y1="24" x2="24" y2="42"/>
        <line x1="24" y1="24" x2="8.41" y2="33"/><line x1="24" y1="24" x2="8.41" y2="15"/>
      </g>
      <circle cx="24" cy="24" r="18" fill="none" stroke="url(#sq-ring)" stroke-width="3"/>
      <circle cx="24" cy="6" r="3.4" fill="#3b82f6"/><circle cx="39.59" cy="15" r="3.4" fill="#6366f1"/>
      <circle cx="39.59" cy="33" r="3.4" fill="#8b5cf6"/><circle cx="24" cy="42" r="3.4" fill="#22d3ee"/>
      <circle cx="8.41" cy="33" r="3.4" fill="#0ea5e9"/><circle cx="8.41" cy="15" r="3.4" fill="#38bdf8"/>
      <rect x="19.5" y="19.5" width="9" height="9" rx="2.2" transform="rotate(45 24 24)" fill="url(#sq-hub)"/>
    </svg>
    <div class="word">Omnium<span class="sub">Studio</span></div>
    <h1>Eén <span class="grad">rondom blik</span> op je hele informatievoorziening</h1>
    <div class="tags">
      <span class="tag"><span class="dot" style="color:#3b82f6;background:currentColor"></span>Gegevens</span>
      <span class="tag"><span class="dot" style="color:#6366f1;background:currentColor"></span>Processen</span>
      <span class="tag"><span class="dot" style="color:#8b5cf6;background:currentColor"></span>Regels</span>
      <span class="tag"><span class="dot" style="color:#22d3ee;background:currentColor"></span>Connectiviteit</span>
    </div>
  </div>
  <div class="strip"></div>
</div>
</body>
</html>
