<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<!-- Bron voor og-image.png (1200×630). Render: open en screenshot exact 1200×630. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #0c0d12; color: #e7e8ef;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
  }
  .og::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(720px 460px at 50% -6%, rgba(99,102,241,.42), transparent 68%),
      radial-gradient(560px 380px at 12% 6%, rgba(34,211,238,.22), transparent 70%),
      radial-gradient(560px 380px at 88% 4%, rgba(139,92,246,.26), transparent 70%);
  }
  .og::after {
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(900px 520px at 50% 42%, #000, transparent 75%);
  }
  .inner { position: relative; z-index: 1; padding: 0 80px; }
  .lockup { display:flex; align-items:center; justify-content:center; gap: 20px; margin-bottom: 34px; }
  .lockup svg { width: 104px; height: 104px; filter: drop-shadow(0 14px 44px rgba(99,102,241,.5)); }
  .word { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .word .sub { font-weight: 300; color: #aeb6cf; margin-left: 8px; }
  h1 {
    font-size: 50px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.08;
    max-width: 18ch; margin: 0 auto 26px;
  }
  .grad { background: linear-gradient(110deg,#60a5fa,#818cf8,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tags { display:flex; gap: 14px; justify-content:center; flex-wrap:wrap; }
  .tag {
    font-size: 21px; font-weight: 600; color: #c7cde0;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    display:flex; align-items:center; gap:10px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }
  .strip { position:absolute; left:0; right:0; bottom:0; height:8px; background: linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6,#22d3ee); z-index:1; }
</style>
</head>
<body>
<div class="og">
  <div class="inner">
    <div class="lockup">
      <svg viewBox="0 0 48 48" aria-label="Omnium Studio">
        <defs>
          <linearGradient id="og-ring" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
          <linearGradient id="og-hub" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#38bdf8"/>
          </linearGradient>
        </defs>
        <g stroke="url(#og-ring)" stroke-width="1.1" opacity="0.35" stroke-linecap="round">
          <line x1="24" y1="24" x2="24" y2="6"/><line x1="24" y1="24" x2="39.59" y2="15"/>
          <line x1="24" y1="24" x2="39.59" y2="33"/><line x1="24" y1="24" x2="24" y2="42"/>
          <line x1="24" y1="24" x2="8.41" y2="33"/><line x1="24" y1="24" x2="8.41" y2="15"/>
        </g>
        <circle cx="24" cy="24" r="18" fill="none" stroke="url(#og-ring)" stroke-width="3"/>
        <circle cx="24" cy="6" r="3.4" fill="#3b82f6"/><circle cx="39.59" cy="15" r="3.4" fill="#6366f1"/>
        <circle cx="39.59" cy="33" r="3.4" fill="#8b5cf6"/><circle cx="24" cy="42" r="3.4" fill="#22d3ee"/>
        <circle cx="8.41" cy="33" r="3.4" fill="#0ea5e9"/><circle cx="8.41" cy="15" r="3.4" fill="#38bdf8"/>
        <rect x="19.5" y="19.5" width="9" height="9" rx="2.2" transform="rotate(45 24 24)" fill="url(#og-hub)"/>
      </svg>
      <div class="word">Omnium<span class="sub">Studio</span></div>
    </div>
    <h1>Eén <span class="grad">rondom blik</span> op je hele informatievoorziening</h1>
    <div class="tags">
      <span class="tag"><span class="dot" style="color:#3b82f6;background:currentColor"></span>Gegevens</span>
      <span class="tag"><span class="dot" style="color:#6366f1;background:currentColor"></span>Processen</span>
      <span class="tag"><span class="dot" style="color:#8b5cf6;background:currentColor"></span>Regels</span>
      <span class="tag"><span class="dot" style="color:#22d3ee;background:currentColor"></span>Connectiviteit</span>
    </div>
  </div>
  <div class="strip"></div>
</div>
</body>
</html>
