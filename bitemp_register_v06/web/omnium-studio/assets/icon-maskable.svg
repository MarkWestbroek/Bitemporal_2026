<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Maskable app-icon: ~22% safe padding so Android's mask never clips the mark. -->
  <defs>
    <linearGradient id="im-ring" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="im-bg" cx="24" cy="18" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1f2b"/><stop offset="1" stop-color="#101118"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" fill="url(#im-bg)"/>
  <g transform="translate(24 24) scale(0.72) translate(-24 -24)">
    <circle cx="24" cy="24" r="14.5" fill="none" stroke="url(#im-ring)" stroke-width="3.2"/>
    <circle cx="24"   cy="9.5"  r="3" fill="#3b82f6"/>
    <circle cx="36.6" cy="16.7" r="3" fill="#6366f1"/>
    <circle cx="36.6" cy="31.3" r="3" fill="#8b5cf6"/>
    <circle cx="24"   cy="38.5" r="3" fill="#22d3ee"/>
    <circle cx="11.4" cy="31.3" r="3" fill="#0ea5e9"/>
    <circle cx="11.4" cy="16.7" r="3" fill="#38bdf8"/>
    <rect x="20" y="20" width="8" height="8" rx="2" transform="rotate(45 24 24)" fill="#cbd5ff"/>
  </g>
</svg>
